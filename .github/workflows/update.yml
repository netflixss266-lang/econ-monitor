name: Update dashboard

on:
  push:
    branches: [main]            # แก้โค้ดแล้ว push → build + deploy ทันที
  schedule:
    - cron: "0 */3 * * *"      # ทุก 3 ชั่วโมง (เวลา UTC)
  workflow_dispatch:            # ปุ่มกดรันเองได้ในหน้า Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้ง dependencies
        run: pip install feedparser requests

      - name: กู้คืน cache ข่าว/ราคาย้อนหลัง
        uses: actions/cache@v4
        with:
          path: |
            cache.json
            market_history.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: สร้างหน้า dashboard
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
