name: Update dashboard

on:
  push:
    branches: [main]            # แก้โค้ดแล้ว push → build + deploy ทันที
  schedule:
    # ทุกครึ่งชั่วโมง — เลี่ยงนาทีที่ 0/30 เพราะ GitHub ตัดคิวช่วงนั้นทิ้งบ่อยที่สุด
    - cron: "7,37 * * * *"     # เวลา UTC
  workflow_dispatch:            # ปุ่มกดรันเองได้ในหน้า Actions
  repository_dispatch:          # ให้ตัวปลุกจากข้างนอกยิงเข้ามาได้ ถ้า cron ของ GitHub ไม่ยอมยิง
    types: [rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25         # ถ้าค้างให้ตายไปเลย รอบถัดไปจะได้เริ่มใหม่ได้
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้ง dependencies
        run: pip install feedparser requests

      # เก็บชุดแท่งเทียนข้ามรอบไว้ด้วย รอบครึ่งชั่วโมงจะได้ไม่ต้องยิง Yahoo ใหม่ทั้งหมด
      - name: กู้คืน cache ข่าว/ราคา/กราฟ
        uses: actions/cache@v4
        with:
          path: |
            cache.json
            market_history.json
            logos.json
            chart
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: สร้างหน้า dashboard
        run: python build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
